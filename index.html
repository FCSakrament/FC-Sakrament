<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FC SAKRAMENT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 65%, #ffd400 100%);
            color: #111;
            min-height: 100vh;
        }

        header {
            background: #ffffff;
            border-bottom: 5px solid #ffd400;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 5px;
            font-weight: bold;
            color: #555;
        }

        nav {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav button {
            background: #111;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        nav button:hover {
            background: #ffd400;
            color: #111;
        }

        .page {
            display: none;
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px;
        }

        .page.active {
            display: block;
        }

        .hero {
            text-align: center;
            padding: 55px 20px;
        }

        .hero .crest {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .hero h2 {
            font-size: 42px;
            font-weight: 900;
        }

        .yellow {
            color: #d9ae00;
        }
